name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag (defaults to build-<run>)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  WA_VERSION: '2.26.36.70'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: jdk 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: gradle
        uses: gradle/actions/setup-gradle@v6

      - name: make gradlew executable
        run: chmod +x ./gradlew

      - name: assemble
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: meta
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | tr '[:upper:]' '[:lower:]' || echo "unknown")
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="build-${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: rename apks
        run: |
          mkdir -p dist
          V="${{ steps.meta.outputs.version }}"
          D=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          R=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          [ -n "$D" ] && cp "$D" "dist/wamodx-${V}-debug.apk"
          [ -n "$R" ] && cp "$R" "dist/wamodx-${V}-release.apk"
          ls -l dist

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: error

      - name: changes
        id: log
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log "$PREV..HEAD" --no-merges --pretty='- %s (`%h`)')
            [ -z "$LOG" ] && LOG="- no changes since $PREV"
          else
            LOG=$(git log -n 1 --pretty='- %s (`%h`)')
          fi
          {
            echo 'list<<CHANGES_EOF'
            echo "$LOG"
            echo 'CHANGES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: WaModX ${{ steps.meta.outputs.version }}
          body: |
            <div align="center">

            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/SoughtXp/WaModX/main/assets/brand/title_dark.png">
              <source media="(prefers-color-scheme: light)" srcset="https://raw.githubusercontent.com/SoughtXp/WaModX/main/assets/brand/title_light.png">
              <img src="https://raw.githubusercontent.com/SoughtXp/WaModX/main/assets/brand/title_light.png" width="300" alt="WaModX">
            </picture>

            <br>

            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/SoughtXp/WaModX/main/assets/brand/stars_dark.png">
              <source media="(prefers-color-scheme: light)" srcset="https://raw.githubusercontent.com/SoughtXp/WaModX/main/assets/brand/stars_light.png">
              <img src="https://raw.githubusercontent.com/SoughtXp/WaModX/main/assets/brand/stars_light.png" height="24" alt="An unofficial WhatsApp mod built against stubs.">
            </picture>

            <br>
            <br>

            These APKs are built against stubs and don't run on their own. To get a working build,
            patch a WhatsApp APK with the smali hooks in
            <a href="https://github.com/SoughtXp/whatsapp-apktool"><b>whatsapp-apktool</b></a>,
            which rewires the host APK to call into WaModX.

            <br>

            <img src="https://img.shields.io/badge/${{ steps.meta.outputs.sha }}-181717?style=flat-square&logo=github&logoColor=white">
            <img src="https://img.shields.io/badge/${{ env.WA_VERSION }}-25D366?style=flat-square&logo=whatsapp&logoColor=white">
            <img src="https://img.shields.io/badge/${{ steps.meta.outputs.version }}-7C3AED?style=flat-square&logo=android&logoColor=white">

            </div>

            ---

            ### What's Changed

            ${{ steps.log.outputs.list }}

            ### Downloads

            | File | About |
            | :--- | :--- |
            | `wamodx-${{ steps.meta.outputs.version }}-debug.apk` | Signed with the debug key, ready to install |
            | `wamodx-${{ steps.meta.outputs.version }}-release.apk` | Unsigned, sign it with your own key before distributing |
          files: dist/*.apk
          fail_on_unmatched_files: true
